name: Channel feeds
# Daily: YouTube RSS (Nuraniah playlist, Basim al-Karbalai, al-Khaqani) → JSON with a growing history.
# Scheduled workflows only run on the default branch; GitHub pauses them after 60 days without repo activity
# (re-enable: Actions tab → Channel feeds → Enable workflow).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fetch-feeds.ts
      - id: commit
        run: |
          git config user.name "tilawa-coach-bot"
          git config user.email "tilawa-coach-bot@users.noreply.github.com"
          git add public/data/feeds
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else git commit -m "Feeds: update channel/playlist history" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: feeds
    if: needs.feeds.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
