name: CI
# typecheck, lint, unit tests, content linter, repo guard — on every push and PR (BRIEF B2.3)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repo guard (no audio, models, datasets, Quran Foundation data or personal data)
        run: npm run guard
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run content:lint
      - run: npm run build
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
